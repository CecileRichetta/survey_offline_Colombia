{{ block scripts }}
<!doctype html>

    <b>Para el encuestador</b>
</h3>

{{ block content }}
<h5>
    {{ formfields }}
</h5>

<script>
    // Function to find and hide field by label text
    function hideFieldByLabel(fieldName, labelTextPart) {
        var labels = document.querySelectorAll('label');
        for (var i = 0; i < labels.length; i++) {
            var label = labels[i];
            if (label.textContent.indexOf(labelTextPart) !== -1) {
                var parent = label.parentElement;
                var attempts = 0;
                while (parent && parent !== document.body && attempts < 10) {
                    var field = parent.querySelector('input[name="' + fieldName + '"], textarea[name="' + fieldName + '"]');
                    if (field) {
                        parent.style.display = 'none';
                        parent.setAttribute('data-conditional-field', fieldName);
                        break;
                    }
                    parent = parent.parentElement;
                    attempts++;
                }
                if (parent && parent.getAttribute('data-conditional-field')) break;
            }
        }
    }

    // Function to toggle actividad_otra based on actividad selection
    function toggleActividadOtra() {
        var actividadRadios = document.querySelectorAll('input[name="module_0_actividad"]');
        var actividadOtraContainer = document.querySelector('[data-conditional-field="module_0_actividad_otra"]');

        if (!actividadOtraContainer) {
            return;
        }

        // Check initial state
        var selectedRadio = document.querySelector('input[name="module_0_actividad"]:checked');
        if (selectedRadio && selectedRadio.value === '6') {
            actividadOtraContainer.style.display = '';
        } else {
            actividadOtraContainer.style.display = 'none';
        }

        // Add event listeners
        for (var i = 0; i < actividadRadios.length; i++) {
            actividadRadios[i].addEventListener('change', function() {
                if (this.value === '6') {
                    actividadOtraContainer.style.display = '';
                } else {
                    actividadOtraContainer.style.display = 'none';
                }
            });
        }
    }

    // First hide the conditional field and mark it
    hideFieldByLabel('module_0_actividad_otra', 'Otra actividad:'); // Replace with actual label text

    // Then set up the toggle
    toggleActividadOtra();
</script>

<p class="text-center">
    <button class="btn-primary">
        SIGUIENTE
    </button>
</p>
{{ endblock }}

{{ block options }}
</html>
{{ endblock }}
